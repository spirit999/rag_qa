<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <title>规章智答 · 企业制度助手</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #202b25;
      background: #f7f8f6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #202b25;
      --muted: #78827b;
      --line: #e8ebe7;
      --green: #277554;
      --green-dark: #1d5e43;
      --green-soft: #eaf3ed;
      --surface: #fff;
      --shadow: 0 14px 40px rgba(34, 57, 43, .07);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 252px;
      flex: 0 0 252px;
      min-height: 100vh;
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      background: #f0f3ef;
      border-right: 1px solid #e6eae5;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px; color: #fff; background: var(--green);
      box-shadow: 0 5px 12px rgba(39, 117, 84, .2);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 15px; font-weight: 720; letter-spacing: .02em; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .new-chat {
      display: flex; justify-content: center; align-items: center; gap: 9px;
      width: 100%; margin-top: 32px; padding: 11px 14px;
      border: 1px solid #dfe6df; border-radius: 11px;
      color: #314238; background: rgba(255,255,255,.82);
      font-size: 13px; font-weight: 620; cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }
    .new-chat:hover { border-color: #b6cabc; background: #fff; transform: translateY(-1px); }
    .new-chat svg { width: 16px; height: 16px; color: var(--green); }
    .side-label {
      margin: 30px 9px 11px; color: #909a92;
      font-size: 10px; font-weight: 700; letter-spacing: .11em;
    }
    .side-prompt {
      display: block; width: 100%; padding: 10px 11px; margin: 2px 0;
      border: 0; border-radius: 9px; background: transparent;
      color: #59665d; text-align: left; font-size: 12px; line-height: 1.5;
      cursor: pointer; transition: background .18s, color .18s;
    }
    .side-prompt:hover { color: var(--green-dark); background: #e5ece5; }
    .side-bottom { margin-top: auto; padding: 14px 10px 2px; border-top: 1px solid #e0e6df; }
    .privacy-note { color: #8a938c; font-size: 11px; line-height: 1.7; }
    .privacy-note svg { width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px; }

    .main-shell { min-width: 0; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      height: 66px; flex: 0 0 66px; padding: 0 34px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(226, 231, 225, .8);
      background: rgba(255,255,255,.56);
    }
    .breadcrumb { display: flex; align-items: center; gap: 9px; color: #8a948c; font-size: 12px; }
    .breadcrumb strong { color: #3a473e; font-weight: 630; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .knowledge-tag {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px;
      border: 1px solid #e5eae5; border-radius: 999px;
      color: #647169; background: #fff; font-size: 11px;
    }
    .knowledge-tag svg { width: 14px; height: 14px; color: var(--green); }
    .health-dot { width: 7px; height: 7px; border-radius: 50%; background: #b5c0b7; }
    .health-dot.ready { background: #48a879; box-shadow: 0 0 0 3px #e8f4ec; }
    .health-dot.error { background: #d66b61; box-shadow: 0 0 0 3px #faecea; }

    .chat-main { width: min(940px, 100%); margin: 0 auto; padding: 0 32px; flex: 1; display: flex; flex-direction: column; }
    .chat-scroll { flex: 1; min-height: 0; padding: 36px 0 26px; }
    .welcome { max-width: 730px; margin: clamp(24px, 8vh, 92px) auto 0; text-align: center; }
    .welcome-symbol {
      width: 60px; height: 60px; margin: 0 auto 20px; display: grid; place-items: center;
      border: 1px solid #deebe0; border-radius: 20px; color: var(--green);
      background: linear-gradient(145deg, #fff, #edf5ee);
      box-shadow: 0 10px 30px rgba(48, 96, 65, .08);
    }
    .welcome-symbol svg { width: 29px; height: 29px; }
    .eyebrow {
      color: var(--green); font-size: 11px; font-weight: 750;
      letter-spacing: .13em; text-transform: uppercase;
    }
    .welcome h1 { margin: 13px 0 10px; color: #27342b; font-size: clamp(25px, 3.5vw, 36px); font-weight: 650; letter-spacing: -.045em; }
    .welcome-copy { max-width: 480px; margin: 0 auto; color: #7a857c; font-size: 14px; line-height: 1.8; }
    .suggestions { margin-top: 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; text-align: left; }
    .suggestion {
      min-height: 91px; display: flex; align-items: flex-start; gap: 13px;
      padding: 16px; border: 1px solid #e7ebe6; border-radius: 13px;
      background: rgba(255,255,255,.82); cursor: pointer; text-align: left;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }
    .suggestion:hover { transform: translateY(-2px); border-color: #c9dbcd; box-shadow: 0 9px 24px rgba(31, 78, 49, .07); }
    .suggestion-icon {
      width: 31px; height: 31px; flex: 0 0 31px; display: grid; place-items: center;
      border-radius: 9px; color: var(--green); background: var(--green-soft);
    }
    .suggestion-icon svg { width: 16px; height: 16px; }
    .suggestion-title { color: #344239; font-size: 12px; font-weight: 650; line-height: 1.55; }
    .suggestion-desc { margin-top: 4px; color: #8b948d; font-size: 11px; line-height: 1.5; }

    #messages { display: flex; flex-direction: column; gap: 24px; }
    .message-row { display: flex; align-items: flex-start; gap: 12px; }
    .message-row.user { justify-content: flex-end; }
    .message-avatar {
      width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center;
      border-radius: 11px; color: var(--green); background: #e8f1e9;
    }
    .message-avatar svg { width: 17px; height: 17px; }
    .message-row.user .message-avatar { order: 2; color: #fff; background: #77937e; }
    .message-avatar.user-avatar { font-size: 12px; font-weight: 700; }
    .message-content { min-width: 0; max-width: min(720px, calc(100% - 45px)); }
    .message-row.user .message-content { max-width: min(660px, calc(100% - 45px)); }
    .message-label { margin: 1px 0 7px; color: #8b958d; font-size: 11px; }
    .message-bubble {
      padding: 15px 17px; border: 1px solid #e8ece7; border-radius: 4px 14px 14px 14px;
      color: #354138; background: #fff; box-shadow: 0 5px 20px rgba(29, 48, 35, .035);
      font-size: 14px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .message-row.user .message-bubble {
      border-color: #e2ece3; border-radius: 14px 4px 14px 14px;
      color: #294d38; background: #eaf2eb; box-shadow: none;
    }
    .answer-meta { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 10px; }
    .meta-chip {
      padding: 4px 8px; border: 1px solid #e7ece7; border-radius: 999px;
      color: #7c887f; background: #fbfcfb; font-size: 10px;
    }
    .meta-chip.answered { color: #397c58; border-color: #dcebe0; background: #f0f7f1; }
    .meta-chip.conflict { color: #a26835; border-color: #f0e2d0; background: #fbf5ed; }
    .meta-chip.insufficient_context { color: #8a765a; border-color: #eee6d9; background: #faf7f1; }
    .timing-line { margin-top: 10px; color: #9aa39c; font-size: 10px; line-height: 1.5; }
    .missing-note {
      margin-top: 12px; padding: 10px 12px; border-left: 2px solid #d8b67e;
      border-radius: 0 7px 7px 0; color: #826f50; background: #fbf8f1;
      font-size: 12px; line-height: 1.6;
    }
    .citations { margin-top: 13px; border: 1px solid #e8ede8; border-radius: 10px; overflow: hidden; background: #fbfcfb; }
    .citations summary {
      padding: 11px 13px; color: #55725e; font-size: 12px; font-weight: 620;
      cursor: pointer; list-style: none;
    }
    .citations summary::-webkit-details-marker { display: none; }
    .citations summary::after { content: "+"; float: right; color: #91a096; font-size: 16px; line-height: 1; }
    .citations[open] summary::after { content: "−"; }
    .citation { margin: 0 10px 10px; padding: 12px; border: 1px solid #edf0ed; border-radius: 8px; background: #fff; }
    .citation-title { color: #47574b; font-size: 11px; font-weight: 650; line-height: 1.6; }
    .citation-text { margin-top: 7px; color: #707b72; font-size: 12px; line-height: 1.75; white-space: pre-wrap; }
    .message-actions { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
    .feedback-button {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px;
      border: 1px solid transparent; border-radius: 7px; color: #879188;
      background: transparent; font-size: 11px; cursor: pointer;
    }
    .feedback-button:hover { border-color: #e5ebe5; color: #4b7255; background: #f6f9f6; }
    .feedback-button:disabled { opacity: .6; cursor: default; }
    .feedback-button svg { width: 13px; height: 13px; }
    .feedback-note { color: #6d9477; font-size: 11px; }
    .pending-bubble { display: flex; align-items: center; gap: 10px; color: #7b887e; }
    .provisional-note { margin-bottom: 5px; color: #a17b42; font-size: 10px; }
    .loading-dots { display: inline-flex; gap: 3px; }
    .loading-dots i { width: 5px; height: 5px; border-radius: 50%; background: #6a9b79; animation: pulse 1.1s infinite ease-in-out; }
    .loading-dots i:nth-child(2) { animation-delay: .15s; }
    .loading-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    .composer-wrap { position: sticky; bottom: 0; padding: 14px 0 17px; background: linear-gradient(180deg, rgba(247,248,246,0), #f7f8f6 18%); }
    .composer {
      display: flex; align-items: flex-end; gap: 12px; padding: 10px 11px 10px 17px;
      border: 1px solid #dfe6df; border-radius: 16px; background: #fff;
      box-shadow: 0 9px 30px rgba(38, 63, 45, .08);
      transition: border-color .18s, box-shadow .18s;
    }
    .composer:focus-within { border-color: #a9c8b1; box-shadow: 0 9px 30px rgba(38, 97, 57, .11); }
    textarea {
      width: 100%; min-height: 30px; max-height: 150px; resize: none; padding: 5px 0;
      border: 0; outline: 0; color: #29372e; background: transparent;
      font-size: 13px; line-height: 1.6;
    }
    textarea::placeholder { color: #a0a9a1; }
    #send {
      width: 37px; height: 37px; flex: 0 0 37px; display: grid; place-items: center;
      border: 0; border-radius: 11px; color: #fff; background: var(--green);
      cursor: pointer; transition: background .18s, transform .18s;
    }
    #send:hover { background: var(--green-dark); transform: translateY(-1px); }
    #send:disabled { cursor: wait; opacity: .55; transform: none; }
    #send svg { width: 17px; height: 17px; }
    .composer-hint { margin: 9px 3px 0; color: #a0a8a1; text-align: center; font-size: 10px; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .sidebar { display: none; }
      .topbar { height: 58px; flex-basis: 58px; padding: 0 18px; }
      .chat-main { padding: 0 20px; }
      .welcome { margin-top: clamp(20px, 7vh, 65px); }
    }
    @media (max-width: 560px) {
      .topbar { padding: 0 14px; }
      .breadcrumb { font-size: 11px; }
      .knowledge-tag { padding: 6px 8px; font-size: 10px; }
      .chat-main { padding: 0 14px; }
      .chat-scroll { padding-top: 22px; }
      .welcome { margin-top: 36px; }
      .welcome-symbol { width: 52px; height: 52px; border-radius: 17px; margin-bottom: 16px; }
      .welcome h1 { font-size: 25px; }
      .welcome-copy { font-size: 13px; }
      .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 24px; }
      .suggestion { min-height: auto; padding: 12px; }
      #messages { gap: 18px; }
      .message-row { gap: 8px; }
      .message-avatar { width: 28px; height: 28px; flex-basis: 28px; border-radius: 9px; }
      .message-content, .message-row.user .message-content { max-width: calc(100% - 36px); }
      .message-bubble { padding: 12px 13px; font-size: 13px; }
      .composer-wrap { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .composer { padding-left: 13px; }
      .composer-hint { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="侧边导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 4.8h8.3l3.7 3.7v10.7H6V4.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 5v4h4M9 12h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div><div class="brand-name">规章智答</div><div class="brand-caption">企业制度知识助手</div></div>
      </div>

      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        开启新对话
      </button>

      <div class="side-label">试着这样提问</div>
      <button class="side-prompt" type="button" data-query="婚假有几天？">婚假有几天？</button>
      <button class="side-prompt" type="button" data-query="出差乘坐飞机报销需要哪些手续？">出差乘坐飞机报销需要哪些手续？</button>
      <button class="side-prompt" type="button" data-query="员工申请调岗需要满足什么条件？">员工申请调岗需要满足什么条件？</button>

      <div class="side-bottom">
        <div class="privacy-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 19 6v5.5c0 4.5-2.9 7.7-7 9.5-4.1-1.8-7-5-7-9.5V6l7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          回答基于制度条文，并提供依据引用
        </div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>工作台</span><span aria-hidden="true">/</span><strong>制度问答</strong></div>
        <div class="topbar-right">
          <span class="knowledge-tag">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h12v16H7a2.5 2.5 0 0 0-2.5 2.5v-16Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.5 19A2.5 2.5 0 0 1 7 16.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            制度知识库
          </span>
          <span id="health" class="knowledge-tag" role="status" aria-live="polite">
            <i class="health-dot" id="health-dot"></i><span id="health-text">正在连接</span>
          </span>
        </div>
      </header>

      <main class="chat-main">
        <div class="chat-scroll" id="chat-scroll">
          <section class="welcome" id="welcome">
            <div class="welcome-symbol" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.2 9l5.8 2.2-5.8 2.1-2.2 5.8-2.1-5.8L4 11.2 9.9 9l2.1-5.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m18.5 15 .9 2.2 2.1.8-2.1.8-.9 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="currentColor"/></svg>
            </div>
            <div class="eyebrow">制度知识助手</div>
            <h1>你好，今天想了解什么制度？</h1>
            <p class="welcome-copy">描述你的问题，我会从公司制度中检索相关条款，整理答案并标明依据。</p>
            <div class="suggestions">
              <button class="suggestion" type="button" data-query="老员工的带薪年休假天数如何计算？">
                <span class="suggestion-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                <span><span class="suggestion-title">假期与考勤</span><span class="suggestion-desc">年休假、婚假、病假怎么规定？</span></span>
              </button>
              <button class="suggestion" type="button" data-query="出差乘坐飞机报销需要哪些手续？">
                <span class="suggestion-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 13 7.4-1.5L8 4.5c-.3-.8.3-1.5 1.1-1.2l2 .7 4.3 7 4.9-1c1-.2 1.7.5 1.1 1.2l-3.2 3.1-1.5 4.5-1.8.4-.7-3.7-5.3 1.1-1.3 2-1.5.3.2-3.1L3 13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
                <span><span class="suggestion-title">差旅与报销</span><span class="suggestion-desc">出差审批、票据和报销流程</span></span>
              </button>
              <button class="suggestion" type="button" data-query="申请住房补贴需要满足什么条件？">
                <span class="suggestion-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
                <span><span class="suggestion-title">补贴与福利</span><span class="suggestion-desc">申请条件、标准和适用对象</span></span>
              </button>
              <button class="suggestion" type="button" data-query="员工申请调岗需要经过什么流程？">
                <span class="suggestion-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M10 7h3a4 4 0 0 1 4 4v3M14 17h-3a4 4 0 0 1-4-4v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
                <span><span class="suggestion-title">人员与流程</span><span class="suggestion-desc">调岗、审批和相关办理要求</span></span>
              </button>
            </div>
          </section>
          <section id="messages" aria-live="polite" aria-label="对话内容"></section>
        </div>

        <div class="composer-wrap">
          <form id="chat-form" class="composer">
            <textarea id="question" maxlength="4000" rows="1" placeholder="输入你的制度问题…" aria-label="输入你的制度问题" required></textarea>
            <button id="send" type="submit" aria-label="发送问题" title="发送">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
          <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 回答仅供制度查询参考</div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const scrollArea = document.getElementById('chat-scroll');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('question');
    const send = document.getElementById('send');
    const history = [];

    function scrollToLatest() {
      requestAnimationFrame(() => scrollArea.scrollTo({
        top: scrollArea.scrollHeight,
        behavior: 'smooth'
      }));
    }

    function addMessage(role, text) {
      welcome.hidden = true;
      const row = document.createElement('article');
      row.className = `message-row ${role}`;
      const avatar = document.createElement('div');
      avatar.className = `message-avatar ${role === 'user' ? 'user-avatar' : ''}`;
      avatar.setAttribute('aria-hidden', 'true');
      if (role === 'user') {
        avatar.textContent = '我';
      } else {
        avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.2 9l5.8 2.2-5.8 2.1-2.2 5.8-2.1-5.8L4 11.2 9.9 9 12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
      }
      const content = document.createElement('div');
      content.className = 'message-content';
      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = role === 'user' ? '你' : '规章智答';
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      content.append(label, bubble);
      row.append(avatar, content);
      messages.appendChild(row);
      scrollToLatest();
      return { row, content, bubble };
    }

    function addPendingMessage() {
      const message = addMessage('assistant', '');
      message.bubble.classList.add('pending-bubble');
      message.bubble.innerHTML = '正在检索制度并整理依据 <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>';
      return message;
    }

    function addCitations(parent, citations) {
      if (!citations || citations.length === 0) return;
      const details = document.createElement('details');
      details.className = 'citations';
      const summary = document.createElement('summary');
      summary.textContent = `查看依据条款 · ${citations.length}`;
      details.appendChild(summary);
      for (const citation of citations) {
        const card = document.createElement('div');
        card.className = 'citation';
        const title = document.createElement('div');
        title.className = 'citation-title';
        title.textContent = [
          citation.doc_title,
          citation.doc_number,
          citation.section,
          citation.article
        ].filter(Boolean).join(' · ');
        const text = document.createElement('div');
        text.className = 'citation-text';
        text.textContent = citation.text || '';
        card.append(title, text);
        details.appendChild(card);
      }
      parent.appendChild(details);
    }

    function addFeedback(parent, requestId) {
      if (!requestId) return;
      const actions = document.createElement('div');
      actions.className = 'message-actions';
      const note = document.createElement('span');
      note.className = 'feedback-note';
      for (const [rating, label, icon] of [
        [1, '有帮助', '<path d="M7 10v10H4V10h3Zm3 10h7.1a2 2 0 0 0 1.9-1.4l1.5-5A2 2 0 0 0 18.6 11H14l.7-3.3A2.2 2.2 0 0 0 12.5 5l-4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'],
        [-1, '不准确', '<path d="M7 14V4H4v10h3Zm3-10h7.1a2 2 0 0 1 1.9 1.4l1.5 5A2 2 0 0 1 18.6 13H14l.7 3.3a2.2 2.2 0 0 1-2.2 2.7l-4-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>']
      ]) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'feedback-button';
        button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">${icon}</svg><span>${label}</span>`;
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const response = await fetch('/api/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ request_id: requestId, rating })
            });
            if (!response.ok) throw new Error('反馈提交失败，请重试');
            note.textContent = '感谢反馈';
            for (const item of actions.querySelectorAll('button')) item.disabled = true;
          } catch (error) {
            note.textContent = error.message;
            button.disabled = false;
          }
        });
        actions.appendChild(button);
      }
      actions.appendChild(note);
      parent.appendChild(actions);
    }

    function statusLabel(status) {
      return ({
        answered: '已回答',
        insufficient_context: '依据不足',
        conflict: '存在冲突'
      })[status] || '已完成';
    }

    function renderAnswer(message, result) {
      const answer = result.answer || {};
      message.bubble.classList.remove('pending-bubble');
      message.bubble.replaceChildren();

      const meta = document.createElement('div');
      meta.className = 'answer-meta';
      const status = document.createElement('span');
      status.className = `meta-chip ${answer.status || ''}`;
      status.textContent = statusLabel(answer.status);
      const confidence = document.createElement('span');
      confidence.className = 'meta-chip';
      confidence.textContent = `置信度 ${answer.confidence || '—'}`;
      meta.append(status, confidence);

      const body = document.createElement('div');
      body.textContent = answer.answer || '暂时没有生成答案。';
      message.bubble.append(meta, body);

      if (answer.missing_conditions?.length) {
        const missing = document.createElement('div');
        missing.className = 'missing-note';
        missing.textContent = `还需要确认：${answer.missing_conditions.join('、')}`;
        message.bubble.appendChild(missing);
      }

      addCitations(message.bubble, answer.citations);
      const timings = result.timings_ms || {};
      const timingParts = [
        ['改写', timings.rewrite],
        ['检索', timings.retrieval],
        ['生成', timings.generation]
      ].filter(([, value]) => Number.isFinite(value))
        .map(([label, value]) => `${label} ${(value / 1000).toFixed(1)}s`);
      if (timingParts.length) {
        const timing = document.createElement('div');
        timing.className = 'timing-line';
        timing.textContent = `${timingParts.join('  ·  ')}${Number.isFinite(timings.total) ? `  ·  总计 ${(timings.total / 1000).toFixed(1)}s` : ''}`;
        message.bubble.appendChild(timing);
      }
      addFeedback(message.content, result.request_id);
      scrollToLatest();
    }

    function updatePendingStage(message, stage) {
      if (message.provisionalBody) return;
      const labels = {
        starting: '正在准备问答服务…',
        rewrite: '正在理解问题…',
        retrieval: '正在检索制度依据…',
        generation: '正在生成答案…'
      };
      message.bubble.textContent = labels[stage] || labels.starting;
    }

    function appendProvisional(message, text) {
      message.bubble.classList.remove('pending-bubble');
      if (!message.provisionalBody) {
        message.bubble.replaceChildren();
        const note = document.createElement('div');
        note.className = 'provisional-note';
        note.textContent = '正在生成 · 尚未完成依据校验';
        const body = document.createElement('div');
        message.bubble.append(note, body);
        message.provisionalBody = body;
      }
      message.provisionalBody.textContent += text;
      scrollToLatest();
    }

    async function ask(question) {
      const query = question.trim();
      if (!query || send.disabled) return;
      addMessage('user', query);
      const pending = addPendingMessage();
      const priorHistory = history.slice(-20);
      history.push(query);
      input.value = '';
      input.style.height = 'auto';
      send.disabled = true;
      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: query, history: priorHistory })
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || '请求失败，请稍后重试');
        }
        if (!response.body) throw new Error('浏览器不支持流式响应。');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let result = null;
        while (true) {
          const { value, done: streamDone } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !streamDone });
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            const data = block.split('\n')
              .filter(line => line.startsWith('data:'))
              .map(line => line.slice(5).trim())
              .join('\n');
            if (!data) continue;
            const event = JSON.parse(data);
            if (event.type === 'stage') {
              updatePendingStage(pending, event.stage);
            } else if (event.type === 'delta') {
              appendProvisional(pending, event.text);
            } else if (event.type === 'done') {
              result = event.result;
              renderAnswer(pending, result);
              history.push(result.answer?.answer || '');
            } else if (event.type === 'error') {
              throw new Error(event.message || '请求失败，请稍后重试');
            }
          }
          if (streamDone) break;
        }
        if (!result) throw new Error('流式响应未正常结束，请重试。');
      } catch (error) {
        pending.bubble.classList.remove('pending-bubble');
        pending.bubble.textContent = `暂时无法完成回答：${error.message}`;
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
        scrollToLatest();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      ask(input.value);
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    });

    document.querySelectorAll('[data-query]').forEach((button) => {
      button.addEventListener('click', () => ask(button.dataset.query || ''));
    });

    document.getElementById('new-chat').addEventListener('click', () => {
      history.length = 0;
      messages.replaceChildren();
      welcome.hidden = false;
      input.value = '';
      input.focus();
      scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
    });

    fetch('/api/health')
      .then(response => response.json())
      .then(data => {
        const ready = Boolean(data.pipeline_loaded);
        document.getElementById('health-text').textContent =
          ready ? '服务已就绪' : '模型初始化中';
        document.getElementById('health-dot').classList.toggle('ready', ready);
      })
      .catch(() => {
        document.getElementById('health-text').textContent = '服务连接失败';
        document.getElementById('health-dot').classList.add('error');
      });
  </script>
</body>
</html>
